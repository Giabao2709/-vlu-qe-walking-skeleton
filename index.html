<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Nhập</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; }
        .login-box { border: 1px solid #ccc; padding: 20px; border-radius: 5px; width: 300px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 style="text-align: center;">Đăng Nhập</h2>
    <div class="form-group">
        <label for="username">Tài khoản:</label>
        <input type="text" id="username" placeholder="Nhập tài khoản">
    </div>
    <div class="form-group">
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu">
    </div>
    <button onclick="handleLogin()">Đăng Nhập</button>
    <div id="message"></div>
</div>

<!-- Import file JS chứa logic -->
<script src="login.js"></script>

<script>
    // Hàm xử lý khi bấm nút Đăng Nhập
    function handleLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const msgDiv = document.getElementById('message');

        // Gọi hàm checkLogin từ file login.js
        if (checkLogin(user, pass)) {
            msgDiv.style.color = "green";
            msgDiv.innerText = "Đăng nhập thành công!";
        } else {
            msgDiv.style.color = "red";
            msgDiv.innerText = "Sai tài khoản hoặc mật khẩu!";
        }
    }
</script>

</body>
</html>
